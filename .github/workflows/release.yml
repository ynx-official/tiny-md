name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # User-authorized exception for this release only; later tags run tests.
  RELEASE_SKIP_TESTS: ${{ github.ref_name == 'v0.2.0' && 'true' || 'false' }}
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test release tools
        if: env.RELEASE_SKIP_TESTS != 'true'
        run: python -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -B scripts/release_notes.py --tag "$RELEASE_TAG"

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: windows-2022
            platform: windows
            arch: x64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0 or v0.1.0-beta.1" >&2
            exit 1
          fi
          core="${version%%[-+]*}"
          printf 'version=%s\ncore=%s\n' "$version" "$core" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Set up Windows x64 compiler
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Locate Windows shader compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem "$sdk\*\x64\fxc.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (!$fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
          Get-Command cl.exe, rc.exe, link.exe

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Check formatting, tests and Clippy
        if: matrix.platform == 'macos' && env.RELEASE_SKIP_TESTS != 'true'
        run: sh scripts/check.sh

      - name: Check macOS formatting and Clippy without tests
        if: matrix.platform == 'macos' && env.RELEASE_SKIP_TESTS == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Windows formatting, tests and Clippy
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RELEASE_SKIP_TESTS -ne 'true') {
            cargo test --locked --workspace --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output 'Rust tests skipped for this user-authorized release'
          }
          cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS release application
        if: matrix.platform == 'macos'
        env:
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/bundle-macos.sh --release --version "$BUNDLE_VERSION"

      - name: Package and verify macOS application
        if: matrix.platform == 'macos'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          bundle="target/release/Tiny MD.app"
          plutil -lint "$bundle/Contents/Info.plist"
          test -x "$bundle/Contents/MacOS/tiny-md"
          lipo "$bundle/Contents/MacOS/tiny-md" -verify_arch "$RELEASE_ARCH"
          sh scripts/package-macos.sh "$RELEASE_VERSION" "$bundle"

      - name: Build and package Windows x64 application
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bundle-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Verify Windows install and uninstall
        if: matrix.platform == 'windows' && env.RELEASE_SKIP_TESTS != 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = (Resolve-Path "target/release-assets/tiny-md-v$env:RELEASE_VERSION-windows-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'tiny-md-install-check'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"")
          $setup = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $installed = Get-FileHash -LiteralPath "$installDir/tiny-md.exe"
          $built = Get-FileHash -LiteralPath 'target/x86_64-pc-windows-msvc/release/tiny-md.exe'
          if ($installed.Hash -ne $built.Hash) { throw 'Installed executable differs from the release build' }
          $uninstaller = Get-ChildItem "$installDir/unins*.exe" | Select-Object -First 1
          if (!$uninstaller) { throw 'Uninstaller was not installed' }
          $remove = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path "$installDir/tiny-md.exe")) { throw 'Uninstall verification failed' }

      - name: Verify Windows portable update helper
        if: matrix.platform == 'windows' && env.RELEASE_SKIP_TESTS != 'true'
        shell: pwsh
        run: ./scripts/test-windows-update.ps1

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/release-assets/tiny-md-v${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Download installers
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate user release notes and update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python -B scripts/release_notes.py --tag "$RELEASE_TAG" --output release-assets/release-notes.md
          python -B scripts/update_manifest.py --dist release-assets --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output release-assets/update-manifest.json

      - name: Generate checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          sha256sum tiny-md-*.dmg tiny-md-*.exe tiny-md-*.zip release-notes.md update-manifest.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload all draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -B scripts/publish_release.py --tag "$RELEASE_TAG" --assets release-assets
