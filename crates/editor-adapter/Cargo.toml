[package]
name = "tiny-md-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-lock = "=3.4.2"
diffy = { version = "=0.4.2", default-features = false }
gpui.workspace = true
guise.workspace = true
unicode-segmentation = "1.13"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
regex = "=1.13.1"
elkrs = "=0.1.1"
serde_json = "=1.0.151"
image = { version = "=0.25.10", default-features = false }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
usvg = { version = "=0.45.1", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
