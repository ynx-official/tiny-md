[package]
name = "tiny-md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
guise.workspace = true
tiny-md-editor.workspace = true
tiny-md-document.workspace = true
trash = "=5.2.9"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
embed-resource = "=3.0.11"
