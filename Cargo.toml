[workspace]
members = ["crates/app", "crates/editor-adapter", "crates/document", "crates/updater"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.2.7"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.0", default-features = false }
guise = { package = "guise-ui", version = "=1.9.1", default-features = false }
tiny-md-editor = { path = "crates/editor-adapter" }
tiny-md-document = { path = "crates/document" }
tiny-md-updater = { path = "crates/updater" }

[profile.dev]
debug = 1

# Diagram layout, font shaping and SVG rasterization are CPU-heavy even in
# development. Optimize these dependencies so `cargo run` stays usable with
# large diagrams while keeping workspace code quick to rebuild and debug.
[profile.dev.package.mermaid-rs-renderer]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.usvg]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
