[workspace]
members = ["crates/app", "crates/editor-adapter", "crates/document"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.0", default-features = false }
guise = { package = "guise-ui", version = "=1.9.1", default-features = false }
tiny-md-editor = { path = "crates/editor-adapter" }
tiny-md-document = { path = "crates/document" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
